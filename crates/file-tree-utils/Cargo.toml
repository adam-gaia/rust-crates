[package]
name = "file-tree-utils"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ls"
source = "./src/bin/ls.rs"

[[bin]]
name = "tree"
source = "./src/bin/tree.rs"

[dependencies]
clap = { version = "4.0.15", features = ["derive", "cargo"] }
color-eyre = "0.6.3"
derive_more = { version = "1.0.0", features = ["full"] }
directories-next = "2.0.0"
env_logger = "0.9.1"
log = "0.4.17"
serde = { version = "1.0.147", features = ["serde_derive"] }
ignore-more = {path = "../ignore-more" }
gix-status = "0.13.0"

