[package]
name = "anyignore"
description = "Make any command respect .ignore files"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5.21", features = ["derive"] }
color-eyre = "0.6.3"
directories = "5.0.1"
env_logger = "0.11.5"
log = "0.4.22"
tempfile = "3.14.0"
which = "7.0.0"
ignore-more = { path = "../ignore-more" }
